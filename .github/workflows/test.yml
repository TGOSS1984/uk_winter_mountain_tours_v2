name: Tests

on:
  push:
  pull_request:

jobs:
  backend-frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the badge back

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- Python / Django ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run Django tests with coverage
        env:
          DEBUG: "1"
          ALLOWED_HOSTS: "127.0.0.1,localhost"
          SECRET_KEY: "django-insecure-test-key"
        run: |
          python -m pytest \
            --cov=bookings \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      # --- Auto-generate coverage badge (from coverage.xml) ---
      - name: Ensure badge folder exists
        run: mkdir -p docs/badges

      - name: Generate coverage badge
        uses: cicirello/coverage-badges-action@v3
        with:
          coverage-data: coverage.xml
          output-file: docs/badges/coverage.svg
          badge-label: Coverage

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update coverage badge [skip ci]"
          file_pattern: docs/badges/coverage.svg

      # --- Node / Jest ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Jest tests
        run: npm test
