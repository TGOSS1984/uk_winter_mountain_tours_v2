name: Tests

on:
  push:
  pull_request:

jobs:
  backend-frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the badge back

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- Python / Django ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure test tools are present even if not in requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run Django tests with coverage
        env:
          DEBUG: "1"
          ALLOWED_HOSTS: "127.0.0.1,localhost"
          SECRET_KEY: "django-insecure-test-key"
        run: |
          python -m pytest \
            --cov=bookings \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      # --- Generate coverage badge without marketplace actions ---
      - name: Make badge folder
        run: mkdir -p docs/badges

      - name: Create coverage.svg from coverage.xml
        run: |
          python - << 'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path("coverage.xml")
          out_path = Path("docs/badges/coverage.svg")

          if not xml_path.exists():
              raise SystemExit("coverage.xml not found")

          root = ET.parse(xml_path).getroot()
          # Cobertura root has attributes: lines-valid, lines-covered, line-rate, etc.
          rate = root.attrib.get("line-rate")
          if rate is None:
              # Try total/lines-valid fallback if needed
              lines_valid = int(root.attrib.get("lines-valid", "0"))
              lines_covered = int(root.attrib.get("lines-covered", "0"))
              pct = 0 if lines_valid == 0 else round(100 * lines_covered / lines_valid)
          else:
              pct = round(float(rate) * 100)

          # Pick a color by threshold
          if pct >= 90:
              color = "#4c1"       # brightgreen
            # elif >= 80 -> green, >= 70 -> yellowgreen, >= 60 -> yellow, >= 50 -> orange, else red
          elif pct >= 80:
              color = "#97CA00"
          elif pct >= 70:
              color = "#a4a61d"
          elif pct >= 60:
              color = "#dfb317"
          elif pct >= 50:
              color = "#fe7d37"
          else:
              color = "#e05d44"

          label = "Coverage"
          value = f"{pct}%"

          # Simple shield-style SVG (no external action needed)
          # width calculations are rough for monospace-like feel
          def w(text): return 6 * len(text) + 20
          w_label = w(label)
          w_value = w(value)
          width = w_label + w_value
          sep = w_label

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="20" role="img" aria-label="{label}: {value}">
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="{width}" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <rect width="{w_label}" height="20" fill="#555"/>
              <rect x="{w_label}" width="{w_value}" height="20" fill="{color}"/>
              <rect width="{width}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle"
               font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="{w_label/2}" y="15" fill="#010101" fill-opacity=".3">{label}</text>
              <text x="{w_label/2}" y="14">{label}</text>
              <text x="{w_label + w_value/2}" y="15" fill="#010101" fill-opacity=".3">{value}</text>
              <text x="{w_label + w_value/2}" y="14">{value}</text>
            </g>
          </svg>'''
          out_path.write_text(svg, encoding="utf-8")
          print(f"Wrote {out_path} with {pct}% coverage")
          PY

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update coverage badge [skip ci]"
          file_pattern: docs/badges/coverage.svg

      # --- Node / Jest ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else:
            npm install
          fi

      - name: Run Jest tests
        run: npm test